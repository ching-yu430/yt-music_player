  function parseSongInfo(videoTitle) {
    let artist='', title=''; const dm = videoTitle.match(/^(.+?)\s*[-–—]\s*(.+?)(?:\s*[\(\[（【｜|].*)?$/);
    if (dm) { artist=dm[1].trim(); title=dm[2].trim(); } else { title = videoTitle.replace(/[\(\[（【].*?[\)\]）】]/g,'').trim(); }
    title = title.replace(/\s*(Official\s*(Music\s*)?Video|MV|Lyric\s*Video|Audio|官方|歌詞版|完整版).*$/i,'').trim();
    artist = artist.replace(/\s*[-–]\s*Topic\s*$/i,'').trim();
    return {artist, title: title||videoTitle};
  }
  function parseLRC(lrcText) {
    const result = []; lrcText.split('\n').forEach(line => {
      const m = line.match(/^\[(\d{2}):(\d{2})\.(\d{2,3})\]\s*(.*)/);
      if (m) { const t=parseInt(m[1])*60+parseInt(m[2])+parseInt(m[3])/(m[3].length===3?1000:100); const txt=m[4].trim(); if(txt)result.push({time:t,text:txt}); }
    }); return result.sort((a,b)=>a.time-b.time);
  }

      const res = await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(q)); if (!res.ok) throw new Error('API error');
      const results = await res.json();
      if (!results.length) {
        const res2 = await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(info.title));
        if (res2.ok) { const r2=await res2.json(); if(r2.length){displayLyrics(r2[0]);return;} }
        els.lyricsBody.innerHTML='<p class="lyrics-placeholder">未找到歌詞</p>'; els.fsLyrics.innerHTML='<div class="fs-lyrics-placeholder">未找到歌詞</div>'; els.miniLyricsBody.innerHTML='<div class="mini-lyrics-placeholder">未找到歌詞</div>'; currentLyricsData=null; return;

    let ai=-1; for(let i=currentLyricsData.synced.length-1;i>=0;i--){if(t>=currentLyricsData.synced[i].time){ai=i;break;}}
    const lineEls = els.fsLyrics.querySelectorAll('.fs-lyrics-line');
    lineEls.forEach((el,i) => { el.classList.toggle('active',i===ai); el.classList.toggle('near', Math.abs(i-ai)<=1 && i!==ai); });
    if (ai>=0 && lineEls[ai]) lineEls[ai].scrollIntoView({behavior:'smooth',block:'center'});
  }
  function highlightMiniLyrics(t) {
    if (!currentLyricsData||!currentLyricsData.synced) return;
    let ai=-1; for(let i=currentLyricsData.synced.length-1;i>=0;i--){if(t>=currentLyricsData.synced[i].time){ai=i;break;}}
    const lineEls = els.miniLyricsBody.querySelectorAll('.mini-lyrics-line');
    lineEls.forEach((el,i) => { el.classList.toggle('active',i===ai); el.classList.toggle('near', Math.abs(i-ai)<=1 && i!==ai); });
    if (ai>=0 && lineEls[ai]) lineEls[ai].scrollIntoView({behavior:'smooth',block:'center'});
  }
  function updateMiniPlayerCenterLyric(t) {
    if (!currentLyricsData||!currentLyricsData.synced) { els.miniPlayerInfo.classList.remove('has-lyric'); return; }
    let ai=-1; for(let i=currentLyricsData.synced.length-1;i>=0;i--){if(t>=currentLyricsData.synced[i].time){ai=i;break;}}
    if (ai>=0 && currentLyricsData.synced[ai].text.trim() !== '') {
      els.miniPlayerLyric.textContent = currentLyricsData.synced[ai].text;
      els.miniPlayerInfo.classList.add('has-lyric');
    } else {
      els.miniPlayerInfo.classList.remove('has-lyric');
    }
  }
  els.lyricsBtn.addEventListener('click', toggleLyrics); els.lyricsClose.addEventListener('click', toggleLyrics);
  function toggleLyrics() { lyricsOpen=!lyricsOpen; els.lyricsColumn.classList.toggle('open',lyricsOpen); els.lyricsBtn.classList.toggle('active',lyricsOpen); }

  /* ============================================================
     FULLSCREEN
     ============================================================ */
  els.fsBtn.addEventListener('click', toggleFullscreen); els.fsCloseBtn.addEventListener('click', toggleFullscreen);
  function toggleFullscreen() {
    if (fsOpen) {
      fsOpen = false; els.fsOverlay.classList.remove('open','playing'); els.fsBtn.classList.remove('active'); stopSpectrum();
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    } else {
      fsOpen = true; els.fsOverlay.classList.add('open'); els.fsBtn.classList.add('active');
      const playing = isReady && player.getPlayerState() === YT.PlayerState.PLAYING; syncFsPlayState(playing);
      try {
        const data = player.getVideoData(); els.fsTitle.textContent = data.title||'—'; els.fsArtist.textContent = cleanAuthor(data.author)||'';
        if (data.video_id) els.fsAlbumImg.src='https://img.youtube.com/vi/'+data.video_id+'/hqdefault.jpg';
      } catch(e){}
      if (!fsParticlesCreated) { createFsParticles(); fsParticlesCreated=true; }
      els.fsOverlay.requestFullscreen().catch(()=>{});
    }
  }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsOpen) { fsOpen = false; els.fsOverlay.classList.remove('open','playing'); els.fsBtn.classList.remove('active'); stopSpectrum(); } });
  function createFsParticles() {
    const variants = ['fs-particle--gold','fs-particle--cream','fs-particle--terra'];
    for (let i=0;i<40;i++) {
      const p=document.createElement('div'); p.className='fs-particle '+variants[i%3];
      const size=4+Math.random()*10; p.style.width=size+'px'; p.style.height=size+'px';
      p.style.left=(Math.random()*100)+'%'; p.style.animationDuration=(10+Math.random()*18)+'s'; p.style.animationDelay=(Math.random()*20)+'s';
      els.fsParticles.appendChild(p);
    }
  }

  /* ============================================================
     KEYBOARD
     ============================================================ */
  els.kbdHintBtn.addEventListener('click', () => els.kbdOverlay.classList.toggle('open'));
  els.kbdOverlay.addEventListener('click', ev => { if(ev.target===els.kbdOverlay) els.kbdOverlay.classList.remove('open'); });
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA') return;
    switch(ev.key.toLowerCase()) {
      case ' ': ev.preventDefault(); togglePlay(); break;
      case 'arrowright': ev.preventDefault(); goNext(); showToast('⏭ 下一首'); break;
      case 'arrowleft': ev.preventDefault(); goPrev(); showToast('⏮ 上一首'); break;
      case 'arrowup': ev.preventDefault(); if(isReady){const v=Math.min(100,(player.getVolume()||0)+5);player.setVolume(v);player.unMute();lastVolume=v;updateVolumeUI(v,false);showToast('🔊 音量 '+v+'%');} break;
      case 'arrowdown': ev.preventDefault(); if(isReady){const v=Math.max(0,(player.getVolume()||0)-5);player.setVolume(v);if(v===0)player.mute();lastVolume=v>0?v:lastVolume;updateVolumeUI(v,v===0);showToast('🔉 音量 '+v+'%');} break;
      case 'm': toggleMute(); showToast(player.isMuted()?'🔇 已靜音':'🔊 已取消靜音'); break;
      case 's': els.shuffleBtn.click(); break;
      case 'r': els.loopBtn.click(); break;
      case 'l': toggleLyrics(); break;
      case 'f': toggleFullscreen(); break;
      case 'g': els.coverWallOpenBtn.click(); break;
      case 'escape':
        if(fsOpen)toggleFullscreen();
        else if(els.coverWallOverlay.classList.contains('open')) setCoverWallOpen(false);
        else if(lyricsOpen)toggleLyrics();
        else if(els.settingsOverlay.classList.contains('open'))closeSettings();
        else if(els.kbdOverlay.classList.contains('open'))els.kbdOverlay.classList.remove('open');
        break;
    }
  });

  window.addEventListener('resize', () => { updateCratePadding(); requestAccordionUpdate(); });

  /* ============================================================
     CRATE SEARCH (C)
     ============================================================ */
  els.crateSearchToggle.addEventListener('click', () => {
    const bar = els.crateSearchBar;
    bar.classList.toggle('open');
    if (bar.classList.contains('open')) { els.crateSearchInput.focus(); }
    else { els.crateSearchInput.value = ''; filterCrate(''); }
  });
  els.crateSearchInput.addEventListener('input', e => filterCrate(e.target.value));
  els.crateSearchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      els.crateSearchBar.classList.remove('open');
      els.crateSearchInput.value = ''; filterCrate('');
      els.crateSearchInput.blur();
    }
  });
  function filterCrate(query) {
    const q = query.toLowerCase().trim();
    crateItems.forEach(c => {
      const name = c.nameEl.textContent.toLowerCase();
      c.el.classList.toggle('search-hidden', q !== '' && !name.includes(q));
    });
    requestAccordionUpdate();
  }

  /* ============================================================
     LYRICS FONT SIZE (D)
     ============================================================ */
  els.lyricsFontUp.addEventListener('click', () => {
    lyricsSizeOffset = Math.min(10, lyricsSizeOffset + 2);
    document.documentElement.style.setProperty('--lyrics-size-offset', lyricsSizeOffset + 'px');
    showToast('🔤 字體放大');
  });
  els.lyricsFontDown.addEventListener('click', () => {
    lyricsSizeOffset = Math.max(-4, lyricsSizeOffset - 2);
    document.documentElement.style.setProperty('--lyrics-size-offset', lyricsSizeOffset + 'px');
    showToast('🔤 字體縮小');
  });

  /* ============================================================
     GESTURE CONTROLS (E)
     ============================================================ */
  (function initGestures() {
    const stage = document.querySelector('.stage');
    let gStartX = 0, gStartY = 0, gStartTime = 0;
    stage.addEventListener('touchstart', e => {
      if (e.target.closest('button, input, .bar, .vol-slider, .crate-scroll, .lyrics-body')) return;
      gStartX = e.touches[0].clientX; gStartY = e.touches[0].clientY; gStartTime = Date.now();
    }, { passive: true });
    stage.addEventListener('touchend', e => {
      if (!gStartTime) return;
      const dt = Date.now() - gStartTime; gStartTime = 0;
      if (dt > 500) return;
      const dx = e.changedTouches[0].clientX - gStartX;
      const dy = e.changedTouches[0].clientY - gStartY;
      const absDx = Math.abs(dx), absDy = Math.abs(dy);
      if (absDx > 60 && absDx > absDy * 1.5) {
        if (dx < 0) { goNext(); showGestureFeedback('⏭ 下一首'); }
        else { goPrev(); showGestureFeedback('⏮ 上一首'); }
      } else if (absDy > 80 && absDy > absDx * 1.5 && isReady) {
        if (dy < 0) {
          const v = Math.min(100, (player.getVolume()||0) + 10);
          player.setVolume(v); player.unMute(); lastVolume = v;
          updateVolumeUI(v, false); showGestureFeedback('🔊 音量 ' + v + '%');
        } else {
          const v = Math.max(0, (player.getVolume()||0) - 10);
          player.setVolume(v); if(v===0) player.mute();
          lastVolume = v > 0 ? v : lastVolume;
          updateVolumeUI(v, v===0); showGestureFeedback('🔉 音量 ' + v + '%');
        }
      }
    }, { passive: true });
  })();
  let gestureFbTimer = null;
  function showGestureFeedback(msg) {
    els.gestureFeedback.textContent = msg;
    els.gestureFeedback.classList.add('visible');
    clearTimeout(gestureFbTimer);
    gestureFbTimer = setTimeout(() => els.gestureFeedback.classList.remove('visible'), 800);
  }

  /* ============================================================
     MINI PLAYER (G)
     ============================================================ */
  els.miniPlayerBtn.addEventListener('click', toggleMiniPlayer);
  els.miniExpandBtn.addEventListener('click', toggleMiniPlayer);
  els.miniPlayBtn.addEventListener('click', togglePlay);
  els.miniPrevBtn.addEventListener('click', goPrev);
  els.miniNextBtn.addEventListener('click', goNext);
  function toggleMiniPlayer() {
    miniPlayerOpen = !miniPlayerOpen;
    document.body.classList.toggle('mini-player-active', miniPlayerOpen);
    els.miniPlayer.classList.toggle('active', miniPlayerOpen);
    els.miniPlayerBtn.classList.toggle('active', miniPlayerOpen);
    if (miniPlayerOpen) { syncMiniPlayer(); showToast('🎵 迷你播放器模式'); }
    else { showToast('🎵 已展開播放器'); }
  }
  function syncMiniPlayer() {
    if (!miniPlayerOpen || !isReady) return;
    try {
      const data = player.getVideoData();
      els.miniPlayerTitle.textContent = data.title || '—';
      els.miniPlayerArtist.textContent = cleanAuthor(data.author) || '—';
      if (data.video_id) els.miniPlayerArt.style.backgroundImage = 'url(https://img.youtube.com/vi/' + data.video_id + '/mqdefault.jpg)';
      els.miniLyricsTitle.textContent = data.title || '—';
      els.miniLyricsArtist.textContent = cleanAuthor(data.author) || '—';
      if (data.video_id) els.miniLyricsArt.style.backgroundImage = 'url(https://img.youtube.com/vi/' + data.video_id + '/mqdefault.jpg)';
    } catch(e) {}
    const playing = isReady && player.getPlayerState() === YT.PlayerState.PLAYING;
    els.miniPlayBtn.innerHTML = playing ?
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>' :
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }

  /* Mini-player lyrics sheet (tap the title/artist area to open) */
  els.miniPlayerInfo.addEventListener('click', toggleMiniLyrics);
  els.miniLyricsCloseBtn.addEventListener('click', toggleMiniLyrics);
  function toggleMiniLyrics() {
    miniLyricsOpen = !miniLyricsOpen;
    els.miniLyricsSheet.classList.toggle('open', miniLyricsOpen);
    if (miniLyricsOpen) {
      syncMiniLyricsMeta();
      if (isReady) highlightMiniLyrics(player.getCurrentTime() || 0);
    }
  }
  function syncMiniLyricsMeta() {
    if (!isReady) return;
    try {
      const data = player.getVideoData();
      els.miniLyricsTitle.textContent = data.title || '—';
      els.miniLyricsArtist.textContent = cleanAuthor(data.author) || '—';
      if (data.video_id) els.miniLyricsArt.style.backgroundImage = 'url(https://img.youtube.com/vi/' + data.video_id + '/mqdefault.jpg)';
    } catch(e) {}
  }
  (function initMiniLyricsSwipe() {
    let startY = 0, startTime = 0, tracking = false;
    els.miniLyricsHeader.addEventListener('touchstart', e => {
      startY = e.touches[0].clientY; startTime = Date.now(); tracking = true;
    }, { passive: true });
    els.miniLyricsHeader.addEventListener('touchend', e => {
      if (!tracking) return; tracking = false;
      const dy = e.changedTouches[0].clientY - startY;
      if (dy > 60 && Date.now() - startTime < 600 && miniLyricsOpen) toggleMiniLyrics();
    }, { passive: true });
  })();

  /* Cover wall staggered animation */
  new MutationObserver(() => {
    if (els.coverWallOverlay.classList.contains('open')) {
      els.cwGrid.querySelectorAll('.cw-item').forEach((item, i) => {
        item.style.animationDelay = (i * 0.03) + 's';
      });
    }
  }).observe(els.coverWallOverlay, { attributes: true, attributeFilter: ['class'] });

  loadYouTubeAPI();
</script>
</body>
</html>
